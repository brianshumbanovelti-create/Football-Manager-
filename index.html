<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E91E63">
<title>Football Manager 2026/27</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
ul,ol{list-style:none}
:root{
  --bg:#f4f4f7;--surface:#ffffff;--surface-2:#f8f9fb;--surface-3:#eef0f4;
  --border:#e2e4e9;--border-strong:#c8ccd4;
  --text:#16161c;--text-muted:#5a5a66;--text-dim:#8a8a95;
  --accent:#E91E63;--accent-soft:#ff4d8d;--accent-dark:#ad1457;--accent-glow:rgba(233,30,99,.12);
  --green:#2ecc71;--green-bg:#e7f7ee;--yellow:#f1c40f;--yellow-bg:#fef7dc;
  --red:#e74c3c;--red-bg:#fbeae8;--blue:#3498db;--blue-bg:#e6f2fb;
  --bar-track:#e4e4ea;
  --topbar-h:52px;--nav-h:60px;
  --radius:12px;--radius-sm:8px;--radius-lg:16px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.4;overflow:hidden;-webkit-tap-highlight-color:transparent}
h1{font-size:22px;font-weight:700;letter-spacing:-.3px}
h2{font-size:17px;font-weight:600}
h3{font-size:14px;font-weight:600}
.muted{color:var(--text-muted)}.dim{color:var(--text-dim)}.hidden{display:none!important}
.center{text-align:center}.grow{flex:1;min-width:0}.truncate{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;align-items:center;gap:10px}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mt-1{margin-top:4px}.mt-2{margin-top:8px}.mt-3{margin-top:16px}
.mb-1{margin-bottom:4px}.mb-2{margin-bottom:8px}.mb-3{margin-bottom:16px}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:780px;margin:0 auto}
#topbar{height:var(--topbar-h);flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--border)}
.topbar-left,.topbar-right{display:flex;align-items:center;gap:10px;min-width:0}
#topbar-club{font-weight:700;font-size:15px}
#topbar-league{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted)}
#topbar-date,#topbar-budget{font-size:12px;color:var(--text-muted);white-space:nowrap}
#screens{flex:1;position:relative;overflow:hidden}
.screen{display:none;position:absolute;inset:0;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}
.screen.active{display:block}
#bottomnav{flex:0 0 auto;height:var(--nav-h);display:flex;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:600;color:var(--text-muted);letter-spacing:.2px;transition:color .15s;position:relative}
.nav-btn.active{color:var(--accent)}
.nav-btn.active::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:26px;height:3px;background:var(--accent);border-radius:0 0 3px 3px}
.btn-primary,.btn-secondary,.btn-ghost,.btn-danger{padding:11px 18px;border-radius:var(--radius-sm);font-weight:600;font-size:14px;transition:background .15s,transform .1s;white-space:nowrap}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 3px 12px var(--accent-glow)}
.btn-primary:hover{background:var(--accent-soft)}
.btn-primary:active{transform:scale(.97)}
.btn-primary:disabled{background:var(--surface-3);color:var(--text-dim);box-shadow:none;cursor:not-allowed}
.btn-secondary{background:var(--surface-3);color:var(--text)}
.btn-secondary:hover{background:var(--border-strong)}
.btn-ghost{background:transparent;color:var(--text-muted);border:1px solid var(--border)}
.btn-ghost:hover{color:var(--text);border-color:var(--border-strong)}
.btn-danger{background:transparent;color:var(--red);border:1px solid var(--red)}
.btn-danger:hover{background:var(--red-bg)}
.btn-sm{padding:7px 11px;font-size:12px;border-radius:var(--radius-sm)}
.tab-bar{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px;margin-bottom:12px;scrollbar-width:none;border-bottom:1px solid var(--border)}
.tab-bar::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:10px 14px;font-size:13px;font-weight:600;color:var(--text-muted);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s,border-color .15s}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.card-highlight{border-left:3px solid var(--accent)}
.card-title{font-size:14px;font-weight:700;margin-bottom:6px}
.card-sub{font-size:12px;color:var(--text-muted)}
.badge{display:inline-block;padding:3px 9px;font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;border-radius:6px;background:var(--surface-3);color:var(--text-muted)}
.badge.blue{background:var(--blue-bg);color:#1c6ea4}
.badge.yellow{background:var(--yellow-bg);color:#8b6f00}
.badge.green{background:var(--green-bg);color:#1c7a4a}
.badge.red{background:var(--red-bg);color:#a52a1f}
.badge.pink{background:#fce4ec;color:var(--accent-dark)}
.fixture-group{margin-bottom:20px}
.fixture-group-title{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text-dim);margin-bottom:8px;padding-left:2px}
.fixture-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:6px;transition:background .15s,border-color .15s}
.fixture-row.is-user{border-left:3px solid var(--accent);padding-left:12px}
.fixture-row.played{opacity:.75}
.fixture-side{display:flex;align-items:center;gap:8px;min-width:0}
.fixture-side.home{justify-content:flex-start}
.fixture-side.away{justify-content:flex-end;flex-direction:row-reverse}
.fixture-team{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fixture-center{font-size:12px;color:var(--text-muted);font-variant-numeric:tabular-nums;text-align:center;min-width:56px}
.fixture-center .score{font-size:15px;font-weight:800;color:var(--accent-soft)}
.bar-row{display:flex;align-items:center;gap:8px;font-size:12px}
.bar-label{width:52px;color:var(--text-muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.bar-track{flex:1;height:6px;background:var(--bar-track);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;transition:width .4s,background .3s}
.bar-fill.fresh{background:var(--green)}
.bar-fill.okay{background:#7fc96b}
.bar-fill.tired{background:var(--yellow)}
.bar-fill.exhausted{background:var(--red)}
.bar-fill.morale-high{background:var(--green)}
.bar-fill.morale-mid{background:var(--blue)}
.bar-fill.morale-low{background:var(--yellow)}
.bar-fill.morale-bad{background:var(--red)}
.bar-value{width:28px;text-align:right;font-variant-numeric:tabular-nums;color:var(--text-muted);font-size:11px}
.bar-status{font-size:11px;color:var(--text-muted);margin-top:2px;padding-left:60px}
.player-row{display:grid;grid-template-columns:34px 1fr 46px 40px;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:6px;cursor:pointer;transition:background .15s,border-color .15s}
.player-row:hover{background:var(--surface-2)}
.player-row.selected{border-color:var(--accent);background:var(--surface-2)}
.player-pos{font-size:11px;font-weight:800;text-align:center;padding:3px 0;border-radius:4px;background:var(--surface-3);color:var(--text-muted)}
.player-pos.GK{background:#fdf3d1;color:#8b6f00}
.player-pos.DEF{background:#e0eefb;color:#1c6ea4}
.player-pos.MID{background:#e6f5ea;color:#1c7a4a}
.player-pos.FWD{background:#fce4ec;color:var(--accent-dark)}
.player-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-meta{font-size:11px;color:var(--text-dim)}
.player-ovr{font-size:15px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
.player-ovr.elite{color:var(--accent-soft)}
.player-ovr.good{color:var(--green)}
.player-ovr.avg{color:var(--text)}
.player-age{font-size:12px;text-align:center;color:var(--text-muted)}
.league-table{width:100%;border-collapse:collapse;font-size:13px}
.league-table th{text-align:left;font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--text-dim);padding:8px 6px;border-bottom:1px solid var(--border)}
.league-table td{padding:9px 6px;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums}
.league-table tr.user-club td{background:#fce4ec;font-weight:700}
.league-table .pos{width:26px;color:var(--text-muted);text-align:center}
.league-table .team{font-weight:600}
.league-table .num{width:30px;text-align:center}
.league-table .pts{font-weight:800;color:var(--accent-soft);width:34px;text-align:center}
.league-table .pos-ucl{color:var(--green);font-weight:700}
.league-table .pos-rel{color:var(--red);font-weight:700}
.event-item{display:grid;grid-template-columns:38px 24px 1fr auto;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--border);font-size:13px;animation:eventIn .3s}
@keyframes eventIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.event-item:last-child{border-bottom:none}
.event-minute{font-size:11px;font-weight:700;text-align:center;padding:3px 0;background:#fce4ec;color:var(--accent-dark);border-radius:6px}
.event-icon{font-size:16px;text-align:center}
.event-player{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.event-detail{font-size:11px;color:var(--text-muted)}
.event-score{font-size:13px;font-weight:800;color:var(--accent-soft);font-variant-numeric:tabular-nums}
.event-item.goal .event-player{color:var(--accent-dark);font-weight:700}
.event-item.ht,.event-item.ft{font-weight:700;color:var(--text-muted);font-size:12px;text-transform:uppercase;letter-spacing:.6px}
#result-banner{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px 12px;padding:20px;background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);margin-bottom:16px;text-align:center}
#result-banner .rb-side{display:flex;flex-direction:column;align-items:center;gap:6px}
#result-banner .rb-team{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
#result-banner .rb-score{font-size:34px;font-weight:800;letter-spacing:-1.5px;color:var(--accent-soft);font-variant-numeric:tabular-nums}
#result-banner .rb-status{grid-column:1/-1;font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--text-muted);margin-top:4px}
.lineup-block{margin-bottom:18px}
.lineup-title{font-size:13px;font-weight:700;margin-bottom:8px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.6px;display:flex;align-items:center;gap:8px}
.lineup-row{display:grid;grid-template-columns:34px 1fr 42px 90px;align-items:center;gap:8px;padding:9px 10px;border-bottom:1px solid var(--border);font-size:13px}
.lineup-row:last-child{border-bottom:none}
.lineup-rating{font-weight:800;text-align:center;font-variant-numeric:tabular-nums;padding:3px 0;border-radius:5px}
.lineup-rating.high{color:#1c7a4a;background:var(--green-bg)}
.lineup-rating.mid{color:var(--text)}
.lineup-rating.low{color:#a52a1f;background:var(--red-bg)}
.lineup-stats{font-size:11px;color:var(--text-muted);text-align:right;white-space:nowrap}
.stat-header{display:grid;grid-template-columns:1fr 42px;gap:8px;padding:6px 10px;font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--text-dim);border-bottom:1px solid var(--border)}
.stat-row{display:grid;grid-template-columns:34px 1fr 42px;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--border);font-size:12px}
.stat-row:last-child{border-bottom:none}
.stat-name{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-sub{font-size:10px;color:var(--text-muted)}
.stat-rating{font-weight:800;text-align:center;padding:3px 0;border-radius:5px;font-variant-numeric:tabular-nums}
.stat-rating.high{color:#1c7a4a;background:var(--green-bg)}
.stat-rating.mid{color:var(--text)}
.stat-rating.low{color:#a52a1f;background:var(--red-bg)}
.manage-section{margin-bottom:16px}
.manage-section h3{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--text-dim);margin-bottom:8px}
.manage-select{width:100%;padding:10px 14px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px;color:var(--text)}
.style-toggle{display:flex;gap:6px}
.style-toggle .tab{flex:1;text-align:center;padding:10px 4px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);margin:0;border-bottom:1px solid var(--border)}
.style-toggle .tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
#match-overlay{position:fixed;inset:0;z-index:1000;background:rgba(20,20,30,.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.match-panel{width:100%;max-width:600px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.15);animation:panelIn .22s}
@keyframes panelIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.match-actions{margin-top:18px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
#live-scoreboard{display:grid;grid-template-columns:1fr auto 1fr;grid-template-rows:auto auto;align-items:center;gap:4px 12px;padding:16px;background:var(--surface-2);border-radius:var(--radius);margin-bottom:16px}
#live-home-name,#live-away-name{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px}
#live-home-name{justify-content:flex-end}
#live-away-name{justify-content:flex-start}
#live-score{font-size:28px;font-weight:800;letter-spacing:-1px;color:var(--accent-soft);grid-column:2;grid-row:1;font-variant-numeric:tabular-nums}
#live-minute{grid-column:1/-1;grid-row:2;text-align:center;font-size:12px;color:var(--text-muted);font-variant-numeric:tabular-nums}
#live-events{display:flex;flex-direction:column;gap:0;max-height:48vh;overflow-y:auto;padding-right:2px}
.empty{text-align:center;padding:48px 20px;color:var(--text-dim);font-size:13px}
.error-box{padding:16px;color:var(--red);font-family:monospace;font-size:12px;white-space:pre-wrap;background:var(--red-bg);border-radius:8px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:4px}
@media (max-width:420px){
  #topbar-league{display:none}
  #topbar-budget{display:none}
  .screen{padding:12px}
  .player-row{grid-template-columns:30px 1fr 42px}
  .player-age{display:none}
  .lineup-row{grid-template-columns:30px 1fr 36px}
  .lineup-stats{display:none}
}
</style>
</head>
<body>
<div id="app">
  <header id="topbar" style="display:none">
    <div class="topbar-left">
      <span id="topbar-club">—</span>
      <span id="topbar-league">—</span>
    </div>
    <div class="topbar-right">
      <span id="topbar-date">—</span>
      <span id="topbar-budget">—</span>
    </div>
  </header>
  <main id="screens"></main>
  <nav id="bottomnav" style="display:none">
    <button class="nav-btn active" data-screen="dashboard">Home</button>
    <button class="nav-btn" data-screen="fixtures">Fixtures</button>
    <button class="nav-btn" data-screen="squad">Squad</button>
    <button class="nav-btn" data-screen="tactics">Tactics</button>

</div>
<div id="match-overlay" class="hidden"></div>

const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
function el(tag, attrs={}, children=[]){
  const node = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){
    if(k==="class") node.className = v;
    else if(k==="html") node.innerHTML = v;
    else if(k==="text") node.textContent = v;
    else if(k.startsWith("on") && typeof v==="function") node.addEventListener(k.slice(2).toLowerCase(), v);
    else if(v!=null && v!==false) node.setAttribute(k,v);
  }
  const kids = Array.isArray(children)?children:[children];
  for(const c of kids){
    if(c==null||c===false) continue;
    if(typeof c==="string"||typeof c==="number") node.appendChild(document.createTextNode(String(c)));
    else if(c instanceof Node) node.appendChild(c);
  }
  return node;
}

function formatMoney(n){
  if(n==null) return "—";
  if(Math.abs(n)>=1e6) return "£"+(n/1e6).toFixed(1)+"M";
  if(Math.abs(n)>=1e3) return "£"+Math.round(n/1e3)+"k";
  return "£"+n;
}
function formatDateLong(dateStr){
  const d = new Date(dateStr+"T00:00:00Z");
  const days=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return `${days[d.getUTCDay()]} ${d.getUTCDate()} ${months[d.getUTCMonth()]} ${d.getUTCFullYear()}`;
}
function addDays(dateStr, days){
  const d = new Date(dateStr+"T00:00:00Z");
  d.setUTCDate(d.getUTCDate()+days);
  return d.toISOString().slice(0,10);
}

function pickWeighted(arr, weights){
  let total = weights.reduce((a,b)=>a+b,0);
  if(total<=0) return arr[0];
  let r = Math.random()*total;
  for(let i=0;i<arr.length;i++){ r -= weights[i]; if(r<=0) return arr[i]; }
  return arr[arr.length-1];
}

function roundRobin(clubIds){
  const teams = [...clubIds];
  const n = teams.length;
  const rounds = [];
  const fixed = teams[0];
  const rotating = teams.slice(1);
  const half = n / 2;
  for(let r=0;r<n-1;r++){
    const left = [fixed, ...rotating.slice(0,half-1)];
    const right = rotating.slice(half-1).reverse();
    const pairs = [];
    for(let i=0;i<half;i++){
      const a = left[i], b = right[i];
      pairs.push(r%2===0?[a,b]:[b,a]);
    }
    rounds.push(pairs);
    rotating.unshift(rotating.pop());
  }
  const second = rounds.map(round => round.map(([h,a])=>[a,h]));
  return [...rounds, ...second];
}

function buildSeasonFixtures(){
  const all = [];
  for(const leagueId of LEAGUE_ORDER){
    const league = LEAGUES[leagueId];
    const rounds = roundRobin(league.clubIds);
    const startDate = "2026-08-01";
    rounds.forEach((round, mdIdx) => {
      const matchday = mdIdx + 1;
      const weekDate = addDays(startDate, mdIdx * 7);
      round.forEach(([home, away], i) => {
        const dayOffset = i < 5 ? 0 : i < 8 ? 1 : i === 8 ? -1 : 2;
        const times = ["12:30","15:00","15:00","15:00","17:30","14:00","16:30","19:00","20:00","20:00"];
        all.push({
          id: `${leagueId}-md${matchday}-${home}-${away}`,
          comp:"league", leagueId, matchday,
          date: addDays(weekDate, dayOffset),
          time: times[i] || "15:00",
          homeClubId: home, awayClubId: away,
          played:false, homeScore:null, awayScore:null
        });
      });
    });
  }
  return all;
}

function roundRobin5(clubIds){
  const arr = [...clubIds, "BYE"];
  const n = arr.length;
  const half = n/2;
  const rounds = [];
  for(let r=0;r<n-1;r++){
    const round = [];
    for(let i=0;i<half;i++){
      const a = arr[i], b = arr[n-1-i];
      if(a !== "BYE" && b !== "BYE") round.push(r%2===0 ? [a,b] : [b,a]);
    }
    rounds.push(round);
    const last = arr.pop();
    arr.splice(1,0,last);
  }
  return rounds;
}

function buildCupFixtures(){
  const shuffled = [...ELITE_CUP_CLUBS].sort(()=>Math.random()-0.5);
  const groups = [[],[],[],[]];

  const fixtures = [];
  const startDate = "2026-08-01";
  const groupStartWeek = addDays(startDate, 4*7 - 3);
  for(let g=0; g<4; g++){
    const rr = roundRobin5(groups[g]);
    const doubled = [...rr, ...rr.map(round => round.map(([h,a])=>[a,h]))];
    doubled.forEach((round, mdIdx) => {
      const roundDate = addDays(groupStartWeek, mdIdx * 7);
      round.forEach(([home, away]) => {
        fixtures.push({
          id: `cup-g${g+1}-r${mdIdx+1}-${home}-${away}`,

          homeClubId:home, awayClubId:away,

    });
  }
  return {groups, fixtures};
}

function buildTable(leagueId){
  const league = LEAGUES[leagueId];
  const rows = {};
  for(const cid of league.clubIds){
    rows[cid] = {clubId:cid,played:0,won:0,drawn:0,lost:0,gf:0,ga:0,gd:0,points:0};
  }
  for(const f of state.fixtures){
    if(f.leagueId!==leagueId || !f.played) continue;
    const h = rows[f.homeClubId], a = rows[f.awayClubId];
    if(!h || !a) continue;
    h.played++; a.played++;
    h.gf += f.homeScore; h.ga += f.awayScore;
    a.gf += f.awayScore; a.ga += f.homeScore;
    if(f.homeScore>f.awayScore){ h.won++; h.points+=3; a.lost++; }
    else if(f.homeScore<f.awayScore){ a.won++; a.points+=3; h.lost++; }
    else { h.drawn++; a.drawn++; h.points++; a.points++; }
  }
  const table = Object.values(rows).map(r => ({...r, gd:r.gf-r.ga}));
  table.sort((x,y)=> y.points-x.points || y.gd-x.gd || y.gf-x.gf || x.clubId.localeCompare(y.clubId));
  table.forEach((r,i)=>r.position = i+1);
  return table;
}

function autoPickLineup(clubId, formationId){
  const squad = getSquadWithState(clubId);
  const slots = FORMATIONS[formationId] || FORMATIONS["4-3-3"];
  const used = new Set();
  const lineup = [];
  for(const slotPos of slots){
    const candidates = squad.filter(p => !used.has(p.id) && !(state.playerStates[p.id]?.banMatches > 0));
    candidates.sort((a,b) => scoreForSlot(b, slotPos) - scoreForSlot(a, slotPos));
    if(!candidates[0]) break;
    lineup.push({...candidates[0], assignedPos:slotPos});
    used.add(candidates[0].id);
  }
  const bench = squad.filter(p => !used.has(p.id) && !(state.playerStates[p.id]?.banMatches > 0)).slice(0, 9);
  return {lineup, bench};
}
function scoreForSlot(p, slotPos){
  return p.overall * posFit(p.position, slotPos) * ((p.fatigue||100)/100);
}

function samplePoisson(lambda){
  const L = Math.exp(-lambda);
  let k = 0, p = 1;
  do { k++; p *= Math.random(); } while (p > L);
  return k - 1;
}

function teamStrength(lineup, style, isHome){
  let total = 0;
  lineup.forEach(p => {
    const slotPos = p.assignedPos || p.position;
    const fit = posFit(p.position, slotPos);
    const fatMult = p.fatigue >= 80 ? 1 : p.fatigue >= 60 ? .95 : p.fatigue >= 40 ? .85 : p.fatigue >= 20 ? .70 : .50;
    total += p.overall * fit * fatMult;
  });
  const avg = total / lineup.length;
  const styleMult = style === "attacking" ? 1.05 : style === "defensive" ? .97 : 1.0;
  const homeMult = isHome ? MATCH.HOME_ADV : 1.0;
  return avg * styleMult * homeMult;
}

function pickScorer(lineup){
  const c = lineup.filter(p => p.position !== "GK");
  const w = c.map(p => {
    const base = Math.max(1, p.overall - 55);
    const posMult = {ST:5,CAM:3,AMR:3,AML:3,LW:3,RW:3,CM:1.4,CDM:.6,CB:.5,LB:.4,RB:.4,LWB:.4,RWB:.4}[p.position] || 1;
    return base * posMult;
  });
  return pickWeighted(c,w);
}
function pickAssist(lineup, scorer){
  const c = lineup.filter(p => p.id !== scorer.id && p.position !== "GK");
  const w = c.map(p => {
    const base = Math.max(1, p.overall - 55);
    const posMult = {CAM:4,AMR:3.5,AML:3.5,LW:3.5,RW:3.5,CM:3,ST:2,LB:1.6,RB:1.6,LWB:1.6,RWB:1.6,CDM:1,CB:.6}[p.position] || 1;
    return base * posMult;
  });
  return pickWeighted(c,w);
}

function simulateMatch(fixture, homeLineup, awayLineup, homeStyle, awayStyle){
  const homeStr = teamStrength(homeLineup, homeStyle, true);
  const awayStr = teamStrength(awayLineup, awayStyle, false);
  const homeXg = clamp(MATCH.BASE_XG * Math.pow(homeStr/awayStr, 1.6), 0.15, 4.8);
  const awayXg = clamp(MATCH.BASE_XG * Math.pow(awayStr/homeStr, 1.6), 0.15, 4.8);

  const homeGoals = samplePoisson(homeXg);
  const awayGoals = samplePoisson(awayXg);

  const events = [];
  const homeMinutes = [], awayMinutes = [];
  for(let i=0;i<homeGoals;i++) homeMinutes.push(randInt(3,90));
  for(let i=0;i<awayGoals;i++) awayMinutes.push(randInt(3,90));
  homeMinutes.sort((a,b)=>a-b); awayMinutes.sort((a,b)=>a-b);

  const allGoals = [
    ...homeMinutes.map(m=>({minute:m,side:"home"})),
    ...awayMinutes.map(m=>({minute:m,side:"away"}))
  ].sort((a,b)=>a.minute-b.minute);

  let hs=0, as=0;
  for(const g of allGoals){
    const lineup = g.side === "home" ? homeLineup : awayLineup;
    const scorer = pickScorer(lineup);
    const assist = pickAssist(lineup, scorer);
    if(g.side === "home") hs++; else as++;
    events.push({
      minute:g.minute, type:"goal", side:g.side,
      playerId:scorer.id, assistId:assist ? assist.id : null,
      homeScore:hs, awayScore:as
    });
  }

  const cardCount = randInt(2,5);
  const cardMap = {};
  for(let i=0;i<cardCount;i++){
    const side = Math.random()<.5 ? "home" : "away";
    const lineup = side === "home" ? homeLineup : awayLineup;
    const p = pick(lineup.filter(x => x.position !== "GK"));
    if(!p) continue;
    const isRed = Math.random()<.06;
    events.push({minute:randInt(5,89),type:isRed?"red":"yellow",side,playerId:p.id});
    cardMap[p.id] = cardMap[p.id] || {yellow:0, red:0};
    if(isRed) cardMap[p.id].red++;
    else cardMap[p.id].yellow++;
  }

  events.sort((a,b)=>a.minute-b.minute);

  const matchStats = {};
  for(const p of [...homeLineup, ...awayLineup]){
    const isGK = p.position === "GK";
    const isDEF = ["CB","LB","RB","LWB","RWB"].includes(p.position);
    const isMID = ["CDM","CM","CAM"].includes(p.position);
    const s = {
      playerId: p.id, minutes: 90,
      goals:0, assists:0, yellow:0, red:0,
      shots:0, shotsOnTarget:0, xg:0,
      passes:0, passesCompleted:0,
      tackles:0, interceptions:0,
      rating: 6.0
    };
    if(isGK){ s.passes = randInt(15,35); s.tackles=0; s.interceptions=randInt(0,1); }
    else if(isDEF){ s.passes=randInt(30,70); s.tackles=randInt(1,5); s.interceptions=randInt(1,4); s.shots=randInt(0,1); }
    else if(isMID){ s.passes=randInt(35,85); s.tackles=randInt(0,4); s.interceptions=randInt(0,3); s.shots=randInt(0,3); }
    else { s.passes=randInt(20,55); s.tackles=randInt(0,2); s.interceptions=randInt(0,1); s.shots=randInt(1,5); }
    s.passesCompleted = Math.floor(s.passes * (0.75 + Math.random()*0.2));
    s.xg = Math.round(Math.random() * (isATT ? 60 : 20)) / 100;
    matchStats[p.id] = s;
  }

  for(const e of events){
    const s = matchStats[e.playerId];
    if(!s) continue;
    if(e.type === "goal"){
      s.goals++; s.rating += 1.2;
      s.shots++; s.shotsOnTarget++; s.xg = Math.round((s.xg + 0.35)*100)/100;
      if(e.assistId && matchStats[e.assistId]){
        matchStats[e.assistId].assists++;
        matchStats[e.assistId].rating += 0.8;
      }
    }
    else if(e.type === "yellow"){ s.yellow++; s.rating -= 0.3; }
    else if(e.type === "red"){ s.red++; s.rating -= 1.5; }
  }

  const homeWin = hs>as, awayWin = as>hs;
  for(const id of Object.keys(matchStats)){
    const isHome = homeLineup.some(p => p.id === id);
    if(homeWin) matchStats[id].rating += isHome ? 0.4 : -0.4;
    else if(awayWin) matchStats[id].rating += isHome ? -0.4 : 0.4;
    matchStats[id].rating = clamp(matchStats[id].rating + (Math.random()-0.5)*0.3, 3, 10);
    matchStats[id].rating = Math.round(matchStats[id].rating * 10)/10;
  }

  return {
    fixture, events, matchStats,
    finalScore:{home:hs,away:as},
    homeLineup, awayLineup,
    cardMap
  };
}

const SAVE_KEY = "fm-2026-27-save-v3";
function saveState(){
  try{
    const payload = {
      userClubId: state.userClubId,
      currentDate: state.currentDate,
      matchday: state.matchday,
      fixtures: state.fixtures,
      cupFixtures: state.cupFixtures,
      cupGroups: state.cupGroups,
      cupDrawn: state.cupDrawn,
      playerStates: state.playerStates,
      inbox: state.inbox,
      userFormation: state.userFormation,
      userLineup: state.userLineup,
      userBench: state.userBench,
      sellCount: state.sellCount
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(payload));
  }catch(e){}
}
function loadState(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    const parsed = JSON.parse(raw);
    if(!parsed.userClubId) return false;
    Object.assign(state, parsed);
    return true;
  }catch(e){ return false; }
}
function clearSave(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }

let currentScreen = "dashboard";
function showScreen(name){
  try{
    currentScreen = name;
    const screens = $("#screens");
    clearEl(screens);
    $$(".nav-btn").forEach(b => b.classList.toggle("active", b.dataset.screen === name));
    const wrap = el("div", {class:"screen active"});
    screens.appendChild(wrap);
    if(name === "dashboard") renderDashboard(wrap);
    else if(name === "fixtures") renderFixtures(wrap);
    else if(name === "squad") renderSquad(wrap);
    else if(name === "tactics") renderTactics(wrap);
    else if(name === "transfers") renderTransfers(wrap);
    else if(name === "inbox") renderInbox(wrap);
    else if(name === "tables") renderTables(wrap);
    updateTopbar();
  } catch(err){
    const screens = $("#screens");
    if(screens){
      clearEl(screens);
      const wrap = el("div", {class:"screen active"});
      wrap.appendChild(el("div", {class:"error-box"}, "Screen '" + name + "' error:\n" + err.message + "\n\n" + (err.stack||"")));
      screens.appendChild(wrap);
    }
    console.error(err);
  }
}

function resignCareer(){

let activeFixturesLeague = null;
function renderFixtures(root){
  if(!activeFixturesLeague) activeFixturesLeague = CLUBS[state.userClubId].leagueId;
  root.appendChild(el("h1", {}, "Fixtures"));
  const bar = el("div", {class:"tab-bar"});
  for(const lid of LEAGUE_ORDER){
    bar.appendChild(el("button", {
      class:"tab" + (lid === activeFixturesLeague ? " active" : ""),
      onclick:()=>{ activeFixturesLeague = lid; showScreen("fixtures"); }
    }, LEAGUES[lid].short));
  }
  bar.appendChild(el("button", {
    class:"tab" + (activeFixturesLeague === "elite-cup" ? " active" : ""),
    onclick:()=>{ activeFixturesLeague = "elite-cup"; showScreen("fixtures"); }
  }, "Elite Cup"));
  root.appendChild(bar);

  if(activeFixturesLeague === "elite-cup"){ renderCupFixtures(root); return; }

  const grouped = {};
  for(const f of state.fixtures){
    if(f.leagueId !== activeFixturesLeague) continue;
    if(!grouped[f.matchday]) grouped[f.matchday] = [];
    grouped[f.matchday].push(f);
  }
  const matchdays = Object.keys(grouped).map(Number).sort((a,b)=>a-b);
  const currentMd = matchdays.find(md => grouped[md].some(f => !f.played)) || matchdays[matchdays.length-1] || 1;
  const idx = matchdays.indexOf(currentMd);
  const window = matchdays.slice(Math.max(0, idx-1), Math.max(0, idx-1)+6);
  for(const md of window){
    const group = el("div", {class:"fixture-group"});
    group.appendChild(el("div", {class:"fixture-group-title"}, "Matchday " + md));
    const fixtures = grouped[md].sort((a,b) => (a.date+a.time).localeCompare(b.date+b.time));
    for(const f of fixtures) group.appendChild(renderFixtureRow(f));
    root.appendChild(group);
  }
}

function renderCupFixtures(root){
  if(!state.cupGroups){
    root.appendChild(el("div", {class:"empty"}, "Elite Cup group draw happens on matchday 3."));
    return;
  }
  root.appendChild(el("div", {class:"card"}, [
    el("div", {class:"card-title"}, "Group Stage"),
    el("div", {class:"card-sub"}, "Home & away vs each team in your group. Top 2 advance.")
  ]));
  for(let g=0; g<4; g++){
    root.appendChild(el("div", {class:"card"}, [
      el("div", {class:"card-title"}, "Group " + String.fromCharCode(65+g)),
      ...buildCupGroupTable(g).map(r => {
        const isUser = r.clubId === state.userClubId;
        return el("div", {class:"row-between",style:"padding:4px 0;font-size:13px" + (isUser ? ";font-weight:700;color:var(--accent-dark)" : "")}, [
          el("span", {style:"display:flex;align-items:center;gap:8px"}, [crestEl(r.clubId, 20), clubName(r.clubId)]),
          el("span", {class:"muted",style:"font-size:11px"}, r.played + " P · " + r.points + " pts")
        ]);
      })
    ]));
  }
  const grouped = {};
  for(const f of state.cupFixtures){
    const key = f.stage + "-" + (f.round || 1);
    if(!grouped[key]) grouped[key] = [];
    grouped[key].push(f);
  }
  const roundKeys = Object.keys(grouped).sort();
  for(const key of roundKeys){
    const group = el("div", {class:"fixture-group"});
    const label = formatCupRoundLabel(key);
    group.appendChild(el("div", {class:"fixture-group-title"}, label));
    const fixtures = grouped[key].sort((a,b) => (a.date+a.time).localeCompare(b.date+b.time));
    for(const f of fixtures) group.appendChild(renderFixtureRow(f));
    root.appendChild(group);
  }
}

function formatCupRoundLabel(key){
  const [stage, round] = key.split("-");
  if(stage === "group") return "Group Stage · Round " + round;
  if(stage === "qf") return "Quarter-Final · Leg " + round;
  if(stage === "sf") return "Semi-Final · Leg " + round;
  if(stage === "final") return "Final";
  return key;
}

function renderFixtureRow(f){
  const isUser = f.homeClubId === state.userClubId || f.awayClubId === state.userClubId;

function openSwapDialog(slotIndex){
  const overlay = $("#match-overlay");
  overlay.classList.remove("hidden");
  clearEl(overlay);
  const slots = FORMATIONS[state.userFormation];
  const slotPos = slots[slotIndex];
  const currentId = state.userLineup[slotIndex];
  const squad = getSquadWithState(state.userClubId);
  const inXI = new Set(state.userLineup);
  const candidates = squad
    .filter(p => !inXI.has(p.id) && p.id !== currentId)
    .filter(p => !(state.playerStates[p.id]?.banMatches > 0))
    .sort((a,b) => (b.overall * posFit(b.position, slotPos)) - (a.overall * posFit(a.position, slotPos)));

  const panel = el("div", {class:"match-panel"}, [
    el("h2", {style:"margin-bottom:4px"}, "Swap Player"),
    el("div", {class:"card-sub", style:"margin-bottom:12px"}, "Slot: " + slotPos + " — currently " + (getPlayerById(currentId)?.name || "—")),
    candidates.length === 0
      ? el("div", {class:"empty"}, "No available players.")

function playerImportance(player){
  const squad = getSquad(player.clubId);
  const sorted = [...squad].sort((a,b) => b.overall - a.overall);
  const rank = sorted.findIndex(p => p.id === player.id);
  if(rank < 3) return "top";
  if(rank < 8) return "mid";
  return "squad";
}

function resolveOffer(player, fee){
  const est = player.value || 10000000;
  const importance = playerImportance(player);
  const sellCount = state.sellCount[player.clubId] || 0;

  if(sellCount >= 2){
    return clubName(player.clubId) + " has already sold 2 first-team players this window. They refuse all further offers.";
  }

  let multiplier = 1.0;
  if(importance === "top") multiplier = 3.0;
  else if(importance === "mid") multiplier = 1.75;

  const askingPrice = Math.round(est * multiplier);

  if(importance === "top" && Math.random() < 0.5){
    return clubName(player.clubId) + " refuses to sell " + player.name + " at any price.";
  }
  if(fee < askingPrice * 0.7){
    return "Offer rejected — too low. " + clubName(player.clubId) + " wants around " + formatMoney(askingPrice) + ".";
  }
  if(fee < askingPrice){
    const counter = Math.round(askingPrice * 1.05);
    const accept = confirm(clubName(player.clubId) + " counters with " + formatMoney(counter) + ". Accept?");
    if(accept) return executeSigning(player, counter);
    return "Offer withdrawn.";
  }
  return executeSigning(player, fee);
}

function executeSigning(player, fee){
  const c = CLUBS[state.userClubId];
  if(fee > c.budget) return "Not enough budget.";
  const p = state.allPlayers.find(x => x.id === player.id);
  if(p){
    const oldClub = p.clubId;
    p.clubId = state.userClubId;
    state.sellCount[oldClub] = (state.sellCount[oldClub] || 0) + 1;
    state.playerStates[p.id] = state.playerStates[p.id] || {
      fatigue:100, morale:75, minutesThisSeason:0, matchesThisSeason:0,
      goals:0, assists:0, yellow:0, red:0, ratingPoints:0, ratingMatches:0, banMatches:0
    };
  }
  c.budget -= fee;
  saveState();
  return "Signed! " + player.name + " joins for " + formatMoney(fee) + ".";
}

function startReveal(){
  clearTimeout(revealTimer);
  const {sim} = currentMatch;
  const step = () => {
    if(currentMatch.paused || currentMatch.finished) return;
    const ev = sim.events[currentMatch.revealIdx];
    if(!ev){
      currentMatch.minute = 90;
      $("#live-minute").textContent = "90'";
      finishMatch();
      return;
    }
    if(currentMatch.minute < ev.minute){
      currentMatch.minute = Math.min(currentMatch.minute + 1, ev.minute);
      $("#live-minute").textContent = currentMatch.minute + "'";
      if(currentMatch.minute >= MATCH.HALF_TIME && !currentMatch.halfTimeDone){
        currentMatch.halfTimeDone = true;
        currentMatch.paused = true;
        renderManage(true);
        return;
      }
      revealTimer = setTimeout(step, MATCH.MINUTE_MS);
      return;
    }
    $("#live-events").appendChild(renderEventItem(ev));
    if(ev.type === "goal") $("#live-score").textContent = ev.homeScore + " – " + ev.awayScore;
    currentMatch.revealIdx++;
    revealTimer = setTimeout(step, MATCH.REVEAL_MS);
  };
  revealTimer = setTimeout(step, 200);
}

  ]);

function resumeMatch(){

  renderLive();

    if(goalsSoFar.length){

function commitMatchStats(sim){
  for(const pid of Object.keys(sim.matchStats)){
    const s = sim.matchStats[pid];
    const ps = state.playerStates[pid];
    if(!ps) continue;
    ps.minutesThisSeason = (ps.minutesThisSeason || 0) + s.minutes;
    ps.matchesThisSeason = (ps.matchesThisSeason || 0) + 1;
    ps.goals = (ps.goals || 0) + s.goals;
    ps.assists = (ps.assists || 0) + s.assists;
    ps.yellow = (ps.yellow || 0) + s.yellow;
    ps.red = (ps.red || 0) + s.red;
    ps.ratingPoints = (ps.ratingPoints || 0) + s.rating;
    ps.ratingMatches = (ps.ratingMatches || 0) + 1;
    ps.fatigue = Math.max(0, (ps.fatigue || 100) - 12);
    if(s.yellow >= 2 && s.red === 0){ ps.red = (ps.red||0) + 1; s.red = 1; }
    if(s.red > 0) ps.banMatches = 3;
    if(ps.ratingMatches >= 20){
      const avg = ps.ratingPoints / ps.ratingMatches;
      const p = getPlayerById(pid);
      if(p){
        let delta = 0;
        if(avg >= 8.0) delta = 2;
        else if(avg >= 7.5) delta = 1;
        else if(avg <= 5.5) delta = -1;
        if(p.age > 32 && delta > 0) delta = Math.max(0, delta - 1);
        p.overall = clamp(p.overall + delta, 40, 99);
      }
      ps.ratingPoints = 0;
      ps.ratingMatches = 0;
    }
  }
}

function finishMatch(){
  currentMatch.finished = true;
  const {sim, fixture} = currentMatch;
  fixture.played = true;
  fixture.homeScore = sim.finalScore.home;
  fixture.awayScore = sim.finalScore.away;

  commitMatchStats(sim);

  for(const pid of Object.keys(state.playerStates)){
    const ps = state.playerStates[pid];
    if(ps.banMatches > 0 && sim.matchStats[pid]) ps.banMatches = Math.max(0, ps.banMatches - 1);
  }

  state.matchday = Math.max(state.matchday, fixture.matchday || state.matchday);

  if(!state.cupDrawn && state.matchday >= 3){
    const result = buildCupFixtures();
    state.cupGroups = result.groups;
    state.cupFixtures = result.fixtures;
    state.cupDrawn = true;
    state.inbox.unshift({
      id: "cup-draw-" + Date.now(),
      title: "Elite Cup draw complete",
      body: "20 clubs split into 4 groups of 5. Check Fixtures → Elite Cup.",
      read: false
    });
  }

  const allNext = [...state.fixtures, ...state.cupFixtures];
  const nextUserFix = allNext.find(f =>
    (f.homeClubId === state.userClubId || f.awayClubId === state.userClubId) && !f.played);
  if(nextUserFix) state.currentDate = nextUserFix.date;

  if(fixture.comp === "league"){
    for(const f of state.fixtures.filter(x => x.leagueId === fixture.leagueId && x.matchday === fixture.matchday && !x.played)){
      const hL = autoPickLineup(f.homeClubId, "4-3-3").lineup;
      const aL = autoPickLineup(f.awayClubId, "4-3-3").lineup;
      const s = simulateMatch(f, hL, aL, "balanced", "balanced");
      f.played = true;
      f.homeScore = s.finalScore.home;
      f.awayScore = s.finalScore.away;
    }
  }

  saveState();
  renderResult();
}

  const evContainer = panel.querySelector("#result-events");
  for(const ev of sim.events) evContainer.appendChild(renderEventItem(ev));
  evContainer.appendChild(el("div", {class:"event-item ft"}, [
    el("div", {class:"event-minute"}, "FT"),
    el("div", {class:"event-icon"}, ""),
    el("div", {}, el("div", {class:"event-player"}, "Full Time")),
    el("div", {class:"event-score"}, sim.finalScore.home + "–" + sim.finalScore.away)
  ]));

  const teamsContainer = panel.querySelector("#result-teams");
  teamsContainer.appendChild(renderLineupBlock("home", sim));
  teamsContainer.appendChild(renderLineupBlock("away", sim));

  panel.querySelectorAll("#result-tabs .tab").forEach(t => {
    t.onclick = () => {
      panel.querySelectorAll("#result-tabs .tab").forEach(x => x.classList.remove("active"));
      t.classList.add("active");
      const target = t.dataset.tab;
      panel.querySelector("#result-events").classList.toggle("hidden", target !== "events");
      panel.querySelector("#result-teams").classList.toggle("hidden", target !== "teams");
    };
  });
}

function renderLineupBlock(side, sim){
  const lineup = side === "home" ? sim.homeLineup : sim.awayLineup;
  const clubId = side === "home" ? sim.fixture.homeClubId : sim.fixture.awayClubId;
  const block = el("div", {class:"lineup-block"}, [
    el("div", {class:"lineup-title"}, [crestEl(clubId, 24), CLUBS[clubId].name])
  ]);
  block.appendChild(el("div", {class:"stat-header"}, [
    el("div", {}, "Player"),
    el("div", {style:"text-align:center"}, "Rating")
  ]));
  for(const p of lineup){
    const s = sim.matchStats[p.id];
    if(!s) continue;
    const ratingCls = s.rating >= 7.5 ? "high" : s.rating >= 6 ? "mid" : "low";
    const bits = [];
    if(s.goals) bits.push(s.goals + " G");
    if(s.assists) bits.push(s.assists + " A");
    bits.push("xG " + s.xg.toFixed(2));
    bits.push("Pass " + s.passesCompleted + "/" + s.passes);
    if(s.tackles) bits.push("Tkl " + s.tackles);
    if(s.interceptions) bits.push("Int " + s.interceptions);
    block.appendChild(el("div", {class:"stat-row"}, [
      el("div", {class:"player-pos " + posClass(p.position)}, p.position),
      el("div", {}, [
        el("div", {class:"stat-name"}, p.name),
        el("div", {class:"stat-sub"}, bits.join(" · "))
      ]),
      el("div", {class:"stat-rating " + ratingCls}, s.rating.toFixed(1))
    ]));
  }
  return block;
}

function getNextFixture(clubId){
  return [...state.fixtures, ...state.cupFixtures]
    .filter(f => (f.homeClubId===clubId || f.awayClubId===clubId) && !f.played)
    .sort((a,b) => (a.date+a.time).localeCompare(b.date+b.time))[0] || null;
}

let clubSelectLeague = "premier-league";
function renderClubSelect(){
  const screens = $("#screens");
  clearEl(screens);
  $("#topbar").style.display = "none";
  $("#bottomnav").style.display = "none";
  const wrap = el("div", {class:"screen active"}, [
    el("h1", {style:"text-align:center;margin-top:20px;margin-bottom:4px"}, "Football Manager"),
    el("p", {class:"muted center mb-3"}, "2026/27 Season · Choose Your Club"),
    el("div", {class:"tab-bar", id:"club-select-tabs"},
      LEAGUE_ORDER.map(lid =>
        el("button", {
          class:"tab" + (lid === clubSelectLeague ? " active" : ""),
          onclick:()=>{ clubSelectLeague = lid; renderClubSelect(); }
        }, LEAGUES[lid].name)
      )
    ),
    el("div", {id:"club-list"})
  ]);
  screens.appendChild(wrap);
  const list = $("#club-list");
  const clubs = LEAGUES[clubSelectLeague].clubIds.map(id => CLUBS[id]).sort((a,b) => b.rating - a.rating);
  for(const c of clubs){
    const card = el("div", {class:"player-row", style:"grid-template-columns:40px 1fr 46px auto"}, [
      crestEl(c.id, 32),
      el("div", {class:"grow"}, [
        el("div", {class:"player-name"}, c.name),
        el("div", {class:"player-meta"}, formatMoney(c.budget) + " budget")
      ]),
      el("div", {class:"player-ovr " + ratingClass(c.rating)}, String(c.rating)),
      el("div", {class:"player-age"}, "")
    ]);
    card.onclick = () => {
      if(!confirm("Manage " + c.name + "?")) return;
      initStateFor(c.id);
      saveState();
      $("#topbar").style.display = "";
      $("#bottomnav").style.display = "";
      showScreen("dashboard");
    };
    list.appendChild(card);
  }
}

function boot(){
  $$(".nav-btn").forEach(b => {
    b.addEventListener("click", () => showScreen(b.dataset.screen));
  });
  state.allPlayers = PLACEHOLDER_PLAYERS;
  const externalScript = document.createElement("script");
  externalScript.src = "data/players.js";
  externalScript.onload = () => {
    if(window.FM_PLAYERS && Array.isArray(window.FM_PLAYERS) && window.FM_PLAYERS.length > 0){
      state.allPlayers = window.FM_PLAYERS;
    }
    bootWithPlayers();
  };
  externalScript.onerror = () => { bootWithPlayers(); };
  document.head.appendChild(externalScript);
}

function bootWithPlayers(){
  try{
    if(loadState() && state.userClubId && CLUBS[state.userClubId]){
      $("#topbar").style.display = "";
      $("#bottomnav").style.display = "";
      showScreen("dashboard");
    } else {
      renderClubSelect();
    }
  } catch(err){
    const screens = $("#screens");
    clearEl(screens);
    const wrap = el("div", {class:"screen active"});
    wrap.appendChild(el("div", {class:"error-box"}, "Boot error:\n" + err.message + "\n\n" + (err.stack||"")));
    screens.appendChild(wrap);
    console.error(err);
  }
}

document.addEventListener("DOMContentLoaded", boot);
</script>
</body>
</html>
